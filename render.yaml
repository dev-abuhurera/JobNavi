# ================================================================
# Render Infrastructure-as-Code (Blueprint) Configuration
# ================================================================
services:
  # 1. Next.js Web Dashboard & REST API
  - type: web
    name: jobnavi-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SESSION_ENCRYPT_KEY
        sync: false

  # 2. Autonomous Agent Worker (Bypassed as Free Web Service)
  - type: web
    name: jobnavi-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npx tsx scripts/worker.ts
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HEADLESS
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SESSION_ENCRYPT_KEY
        sync: false
