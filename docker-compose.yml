version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobnavi-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    command: ["npm", "start"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobnavi-worker
    restart: always
    env_file:
      - .env.local
    command: ["npx", "tsx", "scripts/worker.ts"]
